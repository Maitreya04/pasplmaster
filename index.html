<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/paspl-icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/paspl-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PASPL" />
    <title>pasplmaster</title>
    <!-- Font loading happens via CSS; system font shown first, Geist swaps in when ready -->
    <!-- Inline critical CSS for instant shell render -->
    <style>
      /* Critical: render app shell before any JS loads */
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:#f5f5f5}
      #root{min-height:100dvh;min-height:100vh}

      /* App shell skeleton - picking queue layout */
      .shell{min-height:100dvh;min-height:100vh;background:#f5f5f5;display:flex;flex-direction:column}
      .shell-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
      .shell-title{height:24px;width:140px;background:#e5e5e5;border-radius:6px}
      .shell-avatar{width:32px;height:32px;background:#e5e5e5;border-radius:50%}
      .shell-stats{padding:8px 16px;display:flex;gap:12px}
      .shell-stat{flex:1;height:48px;background:#fff;border-radius:12px;border:1px solid #eaeaea}
      .shell-content{padding:16px;flex:1}
      .shell-section-label{height:12px;width:100px;background:#e5e5e5;border-radius:4px;margin-bottom:12px}
      .shell-card{background:#fff;border-radius:16px;border:1px solid #eaeaea;padding:16px;margin-bottom:12px}
      .shell-card-row{display:flex;align-items:center;gap:12px}
      .shell-card-icon{width:44px;height:44px;background:#f5f5f5;border-radius:12px;flex-shrink:0}
      .shell-card-text{flex:1}
      .shell-card-line{height:14px;background:#e5e5e5;border-radius:4px;margin-bottom:8px}
      .shell-card-line.short{width:60%}
      .shell-card-line.tiny{width:40%;height:10px}
      .shell-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #eaeaea;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
      .shell-nav-item{width:48px;height:36px;background:#f5f5f5;border-radius:8px}

      /* Skeleton shimmer animation */
      @keyframes shimmer{0%{background-position:200% 0}to{background-position:-200% 0}}
      .shimmer{background:linear-gradient(90deg,#e5e5e5 25%,#f0f0f0 50%,#e5e5e5 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}

      /* Spinner fallback for non-picking routes */
      .shell-spinner-wrap{display:none;align-items:center;justify-content:center;min-height:100dvh;background:#f5f5f5}
      .shell-spinner{width:28px;height:28px;border:3px solid #d9d9d9;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Picking queue skeleton - shown instantly, replaced when React hydrates -->
      <div class="shell" id="app-shell">
        <div class="shell-header">
          <div class="shell-title shimmer"></div>
          <div class="shell-avatar shimmer"></div>
        </div>
        <div class="shell-stats">
          <div class="shell-stat shimmer"></div>
          <div class="shell-stat shimmer"></div>
          <div class="shell-stat shimmer"></div>
        </div>
        <div class="shell-content">
          <div class="shell-section-label shimmer"></div>
          <div class="shell-card">
            <div class="shell-card-row">
              <div class="shell-card-icon shimmer"></div>
              <div class="shell-card-text">
                <div class="shell-card-line shimmer"></div>
                <div class="shell-card-line short shimmer"></div>
              </div>
            </div>
          </div>
          <div class="shell-card">
            <div class="shell-card-row">
              <div class="shell-card-icon shimmer"></div>
              <div class="shell-card-text">
                <div class="shell-card-line shimmer"></div>
                <div class="shell-card-line short shimmer"></div>
              </div>
            </div>
          </div>
          <div class="shell-card">
            <div class="shell-card-row">
              <div class="shell-card-icon shimmer"></div>
              <div class="shell-card-text">
                <div class="shell-card-line shimmer"></div>
                <div class="shell-card-line tiny shimmer"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="shell-nav">
          <div class="shell-nav-item shimmer"></div>
          <div class="shell-nav-item shimmer"></div>
          <div class="shell-nav-item shimmer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
