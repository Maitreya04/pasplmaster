<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/paspl-icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/paspl-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PASPL" />
    <title>pasplmaster</title>
  </head>
  <body>
    <div id="root">
      <!-- Shell shown before React mounts. Background matches --bg-primary (#f5f5f5)
           so there is never a white flash regardless of bundle load time. -->
      <style>
        #root-shell {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100dvh;
          background: #f5f5f5;
          font-family: sans-serif;
        }
        #root-shell-spinner {
          width: 28px;
          height: 28px;
          border: 3px solid #d9d9d9;
          border-top-color: #2563eb;
          border-radius: 50%;
          animation: root-spin 0.7s linear infinite;
        }
        @keyframes root-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div id="root-shell">
        <div id="root-shell-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
